<!doctype html>
<!-- Renders the real ezgeyser-card.js with simulated readings for the README screenshots. See capture.sh. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=block">
<style>
  body{margin:0;font-family:Roboto,Arial,sans-serif}
  body.light{background:#fafafa}body.dark{background:#111111}
  #stage{display:inline-grid;gap:16px;padding:24px;align-items:start}
</style>
<script src="../../custom_components/ezgeyser/www/ezgeyser-card.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
// Every reading below is made up. Heating states have not been captured from a real geyser. Event times are local
// (capture.sh renders in Asia/Karachi) and relative to today, so "+1" stays right whenever this runs. The dashboard
// scenes are the owner's four mockup scenarios (Dashboard card update 2); Ground Floor Bathroom has no schedule.
function at(days, hours, minutes = 0) {
  const date = new Date();
  date.setDate(date.getDate() + days); date.setHours(hours, minutes, 0, 0);
  return date.toISOString();
}
const EVERY_DAY = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const WEEKDAYS = ['monday','tuesday','wednesday','thursday','friday'];
const event = (target, more = {}) => ({target_temperature:target, heating_off:target === null, source:'gas', source_code:1,
  switch_over:false, repeat_days:EVERY_DAY, ...more});
// The mockup draws one element bar; a geyser with two elements is the card's default.
const ONE_ELEMENT = {element_count:1};
const GEYSERS = {
  upstairs: {name:'Upstairs', values:{top:'39.5', bottom:'35.1', target:'0', next_event:at(0, 21, 30)},
    event:event(55, {switch_over:true, repeat_days:WEEKDAYS}), config:ONE_ELEMENT},
  kitchen: {name:'Kitchen', values:{top:'51.8', bottom:'47.2', target:'65', burner_left:'on', burner_right:'on', boost:'on',
    timer:'25', wifi:'fair', next_event:at(1, 6)}, event:event(60), config:ONE_ELEMENT},
  bathroom: {name:'Ground Floor Bathroom', values:{top:'28.4', bottom:'24.9', target:'0', vacation:'on', wifi:'excellent'},
    config:ONE_ELEMENT},
  guest: {name:'Guest Bathroom', values:{top:'unknown', top_ok:'off', bottom:'41.3', target:'50', element_1:'on', wifi:'weak',
    cloud:'off', next_event:at(1, 5, 30)}, event:event(50), config:ONE_ELEMENT},
  laundry: {name:'Laundry', values:{top:'42.0', bottom:'40.6', target:'50', element_1:'on', element_2:'on', vacation:'on',
    next_event:at(1, 7)}, event:event(null)},
  garage: {name:'Garage', values:{top:'36.4', bottom:'33.0', target:'0', next_event:at(1, 6, 30)}, event:event(45), unreachable:true},
  roof: {name:'Rooftop', values:{top:'58.1', bottom:'57.4', target:'60', burner_left:'on', timer:'90', next_event:at(0, 22)},
    event:event(60, {repeat_days:null})},
  // The longest values the acceptance checks name, at once.
  stress: {name:'Ground Floor Master Bathroom', values:{top:'88.8', bottom:'47.2', target:'72.5', source:'hybrid', source_code:3,
    timer:'180', boost:'on', vacation:'on', wifi:'excellent', cloud:'off', clock:'on', next_event:at(7, 12, 30)}, event:event(72.5)},
};
const DASHBOARD = ['upstairs','kitchen','bathroom','guest'];
const SCENES = {
  'dashboard-light': {dark:false, columns:[345,345], cards:DASHBOARD},
  'dashboard-dark': {dark:true, columns:[345,345], cards:DASHBOARD},
  'idle': {dark:false, columns:[360], cards:['upstairs']},
  'gas-heating': {dark:true, columns:[360], cards:['kitchen']},
  'electric-heating': {dark:false, columns:[360], cards:['laundry']},
  'sensor-fault': {dark:true, columns:[360], cards:['guest']},
  'unreachable': {dark:false, columns:[360], cards:['garage']},
  'narrow': {dark:false, columns:[200,200,200], cards:['kitchen','laundry','roof']},
  'details': {dark:false, columns:[360], cards:['upstairs'], details:true},
  // One card per row, at the three acceptance widths.
  'stress': {dark:false, widths:[388,336,296], cards:['stress','stress','stress']},
  'stress-dark': {dark:true, widths:[388,336,296], cards:['stress','stress','stress']},
};
const DEFAULTS = {source:'gas', source_code:1, top_ok:'on', bottom_ok:'on', burner_left:'off', burner_right:'off',
  element_1:'off', element_2:'off', boost:'off', vacation:'off', next_event:'unknown', timer:'0', wifi:'good', cloud:'on',
  clock:'off'};
const isSensor = key => ['top','bottom','target','source','next_event','timer','wifi'].includes(key);

function states(id, values, override, attributes = GEYSERS[id].event) {
  const all = {...DEFAULTS, ...values};
  return Object.fromEntries(Object.entries(FIELDS).map(([key,suffix]) => [
    `${isSensor(key) ? 'sensor' : 'binary_sensor'}.${id}_${suffix}`,
    {state:override ?? all[key], last_updated:'2026-11-11T07:42:00',
     attributes:{...(['top','bottom','target'].includes(key) ? {unit_of_measurement:'°C'} : {}),
                 ...(key === 'source' ? {source_code:all.source_code} : {}),
                 ...(key === 'next_event' ? attributes : {})}},
  ]));
}
const registry = Object.keys(GEYSERS).flatMap(id => Object.entries(FIELDS).map(([key,suffix]) => ({
  entity_id:`${isSensor(key) ? 'sensor' : 'binary_sensor'}.${id}_${suffix}`, platform:'ezgeyser',
  device_id:`device-${id}`, unique_id:`70041d1234${id.length}_${suffix}`,
})));

async function main() {
  const scene = SCENES[new URLSearchParams(location.search).get('s')];
  document.body.className = scene.dark ? 'dark' : 'light';
  const stage = document.getElementById('stage');
  stage.style.gridTemplateColumns = scene.widths ? 'max-content' : scene.columns.map(w => `${w}px`).join(' ');
  const live = Object.assign({}, ...Object.keys(GEYSERS).map(id => states(id, GEYSERS[id].values)));
  const devices = Object.fromEntries(Object.keys(GEYSERS).map((id,i) => [`device-${id}`, {name:GEYSERS[id].name,configuration_url:`http://192.168.1.${50+i}/`}]));
  const hass = {states:live, devices, locale:{language:'en'}, config:{unit_system:{temperature:'°C'}}, themes:{darkMode:scene.dark}, callWS:async () => registry};
  const cards = scene.cards.map((id, i) => {
    const card = document.createElement('ezgeyser-card');
    if (scene.widths) card.style.width = `${scene.widths[i]}px`;
    card.setConfig({device_id:`device-${id}`, name:GEYSERS[id].name, ...GEYSERS[id].config});
    stage.append(card);
    card.hass = hass;
    return [id, card];
  });
  await document.fonts.ready;
  await new Promise(resolve => setTimeout(resolve, 100));
  // An unreachable card first sees good readings, then keeps them as last known values.
  for (const [id, card] of cards) {
    if (GEYSERS[id].unreachable) card.hass = {...hass, states:{...live, ...states(id, {}, 'unavailable')}};
  }
  await new Promise(resolve => setTimeout(resolve, 100));
  if (scene.details) {
    // Wider than the 600 px phone breakpoint (headless Chrome windows are at least ~500 px wide anyway), so the window
    // shows centred, as on a desktop, over the card that opened it.
    stage.style.minWidth = '632px'; stage.style.minHeight = '452px';
    cards[0][1]._openDetails();
  }
  document.title = `${stage.offsetWidth}x${stage.offsetHeight}`;
}
main();
</script>
</body>
</html>
