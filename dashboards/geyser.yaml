# The integration automatically registers the card.
# Copy the ID from the geyser device page URL: /config/devices/device/<device_id>.
# This is a Home Assistant device ID, not a sensor entity ID or MAC address.
type: custom:ezgeyser-card
device_id: YOUR_HOME_ASSISTANT_DEVICE_ID
name: Kitchen
